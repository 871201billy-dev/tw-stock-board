name: 更新行情並部署

on:
  schedule:
    - cron: "*/5 0-5 * * 1-5"   # 台北時間 08:00–13:59 每 5 分鐘（GitHub 排程常會延遲數分鐘）
    - cron: "0 7,9,12 * * 1-5"  # 收盤後更新每日收盤行情
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: pages
        uses: actions/configure-pages@v5
      - name: 抓取行情
        run: node scripts/fetch.mjs "${{ steps.pages.outputs.base_url }}/"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
